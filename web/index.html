<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traductor de video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body class="view-library layout-wide">
<header class="bar">
  <div class="brand">Traductor <span>en → es</span></div>
  <div class="status" id="status" data-state="off"><i></i><span>sin conexión</span></div>
  <form class="yt" id="yt">
    <svg class="yt-ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.7 0l2.4-2.4a2.6 2.6 0 0 0-3.7-3.7l-.9.9M9.4 6.6a2.6 2.6 0 0 0-3.7 0L3.3 9a2.6 2.6 0 0 0 3.7 3.7l.9-.9"/></svg>
    <input id="yt-url" type="text" placeholder="Pega uno o varios enlaces de YouTube" spellcheck="false" aria-label="Enlaces de YouTube">
    <button class="btn" id="import-go" type="submit" disabled>Importar</button>
  </form>
  <label class="btn files-btn" id="file-btn" title="Importar videos o audios del equipo">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.5V2.5M4.8 5.6L8 2.5l3.2 3.1M2.5 10v3.5h11V10"/></svg>Archivos<input id="file" type="file" accept="video/*,audio/*" multiple hidden>
  </label>
  <i class="nav-sep" aria-hidden="true"></i>
  <div class="queue-wrap">
    <button class="btn" id="queue-btn" type="button">Cola<span class="badge" id="queue-badge" hidden></span></button>
    <div class="popover queue-pop" id="queue-pop" hidden>
      <div class="queue-head"><span id="queue-state"></span><button class="btn" id="queue-toggle" type="button"></button></div>
      <ul id="queue-list"></ul>
      <button class="btn ghost" id="queue-clear" type="button" hidden>Limpiar terminados</button>
    </div>
  </div>
  <button class="btn" id="prefs-btn" type="button">Preferencias</button>
  <button class="btn" id="view" type="button">Biblioteca</button>
</header>

<!-- acciones del video abierto -->
<div class="vbar player-only" id="vbar">
  <div class="vtitle" id="file-name"></div>
  <div class="vacts">
    <div class="save-wrap">
      <button class="btn" id="save" type="button">Guardar en…</button>
      <div class="popover" id="save-pop" hidden>
        <ul id="save-list"></ul>
        <form id="save-new"><input id="save-name" type="text" placeholder="Nueva colección" maxlength="80"><button class="btn" type="submit">Crear</button></form>
      </div>
    </div>
    <button class="btn" id="layout" type="button">Ver dividido</button>
    <button class="btn" id="export-btn" type="button">Exportar</button>
  </div>
</div>

<main class="stage">
  <section class="pane" id="pane-en">
    <div class="tag">EN · original</div>
    <div class="screen">
      <video id="v-en" playsinline preload="auto"></video>
      <div class="caption" id="cap-en"><span class="c"></span><span class="t"></span></div>
      <div class="caption es-wide" id="cap-es-wide"><span class="c"></span></div>
      <div class="ready" id="ready" hidden><i></i><span></span><b><em></em></b></div>
      <div class="mini-acts">
        <button class="ic" id="mini-back" type="button" aria-label="Volver al video" title="Volver al video">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5L8.5 7.5M6.5 13.5h-4v-4M2.5 13.5l5-5"/></svg>
        </button>
        <button class="ic" id="mini-close" type="button" aria-label="Cerrar" title="Cerrar">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
        </button>
      </div>
    </div>
    <div class="ctrl" id="ctrl">
      <button class="ic" id="c-play" type="button" aria-label="Reproducir">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path class="i-play" d="M4.5 2.8v10.4l8.6-5.2z"/><g class="i-pause"><rect x="3.8" y="2.8" width="2.8" height="10.4"/><rect x="9.4" y="2.8" width="2.8" height="10.4"/></g></svg>
      </button>
      <span class="c-time" id="c-time">0:00 / 0:00</span>
      <div class="track" id="track">
        <div class="t-layer t-cov" id="t-cov"></div>
        <div class="t-layer t-dub" id="t-dub"></div>
        <div class="t-notes" id="t-notes"></div>
        <div class="t-play" id="t-play"></div>
        <i class="t-head" id="t-head"></i>
        <span class="t-tip" id="t-tip" hidden></span>
      </div>
      <div class="lang" id="c-lang">
        <button type="button" data-v="es" title="Escuchar en español">ES</button><button type="button" data-v="en" title="Escuchar el original">EN</button>
      </div>
      <div class="vol">
        <button class="ic" id="c-mute" type="button" aria-label="Silenciar">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path class="i-spk" d="M2.5 6h2.6l3.6-3v10l-3.6-3H2.5z"/><path class="i-wave" d="M10.8 5.4a3.6 3.6 0 0 1 0 5.2M12.6 3.6a6.2 6.2 0 0 1 0 8.8"/><path class="i-x" d="M10.6 6l3.6 4M14.2 6l-3.6 4"/></svg>
        </button>
        <input type="range" id="c-vol" min="0" max="1" step="0.05" value="1" aria-label="Volumen">
      </div>
      <button class="ic" id="c-full" type="button" aria-label="Pantalla completa">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>
      </button>
    </div>
  </section>
  <section class="pane">
    <div class="tag">ES · traducido</div>
    <div class="screen">
      <video id="v-es" muted playsinline preload="auto"></video>
      <div class="caption" id="cap-es"><span class="c"></span></div>
    </div>
    <div class="timeline" id="tl-es"></div>
  </section>
</main>

<section class="side" id="side">
  <nav class="side-tabs" id="side-tabs">
    <button type="button" class="on" data-tab="transcript">Transcripción</button>
    <button type="button" data-tab="upnext">Siguientes</button>
  </nav>
  <ol class="transcript" id="transcript"></ol>
  <ol class="upnext" id="upnext" hidden></ol>
</section>

<section class="library" id="library">
  <nav class="collections" id="collections"></nav>
  <div class="shelf">
    <div class="shelf-head" id="shelf-head"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section class="prefs-screen" id="prefs-screen">
  <aside class="prefs-nav" id="prefs-nav"></aside>
  <div class="prefs-body" id="prefs-body"></div>
</section>

<!-- importar sesión de YouTube: se muestra dentro de la sección YouTube de Preferencias -->
<div id="stash" hidden><div class="pref yt-import" id="yt-import">
  <span class="pref-label">Importar sesión</span>
  <div class="pref-ctl">
    <div class="segs" id="yt-browsers"></div>
    <div class="segs"><label class="seg">Subir cookies.txt<input type="file" id="cookies-file" accept=".txt,text/plain" hidden></label></div>
    <small id="cookies-status"></small>
  </div>
</div></div>

<dialog class="dlg" id="export-dlg">
  <form method="dialog" id="export-form">
    <h3 id="export-title"></h3>
    <p class="dlg-sub" id="export-sub"></p>
    <div class="opts">
      <label><input type="checkbox" name="kind" value="es_video" checked><span>Video traducido</span><small>MP4</small></label>
      <label><input type="checkbox" name="kind" value="es_audio"><span>Audio traducido</span><small>M4A</small></label>
      <label><input type="checkbox" name="kind" value="orig_video"><span>Video original</span><small>MP4</small></label>
      <label><input type="checkbox" name="kind" value="orig_audio"><span>Audio original</span><small>M4A</small></label>
    </div>
    <p class="dlg-note" id="export-note"></p>
    <div class="dlg-actions">
      <button class="btn ghost" value="cancel" type="submit">Cancelar</button>
      <button class="btn dark" value="ok" type="submit" id="export-go">Exportar</button>
    </div>
  </form>
</dialog>

<dialog class="dlg" id="pl-dlg">
  <form method="dialog">
    <h3>Este enlace es de una playlist</h3>
    <div class="dlg-actions">
      <button class="btn ghost" value="video" type="submit">Solo este video</button>
      <button class="btn dark" value="playlist" type="submit">Agregar playlist</button>
    </div>
  </form>
</dialog>

<dialog class="dlg dlg-wide" id="multi-dlg">
  <form method="dialog" id="multi-form">
    <h3>Importar varios enlaces</h3>
    <textarea id="multi-text" rows="8" spellcheck="false" placeholder="https://www.youtube.com/watch?v=…&#10;https://youtu.be/…&#10;https://www.youtube.com/playlist?list=…"></textarea>
    <p class="dlg-sub" id="multi-sum"></p>
    <label class="dlg-field"><span>Guardar en</span><select id="multi-coll"></select></label>
    <div class="dlg-actions">
      <button class="btn ghost" value="cancel" type="submit">Cancelar</button>
      <button class="btn dark" value="ok" type="submit" id="multi-go">Importar</button>
    </div>
  </form>
</dialog>

<dialog class="dlg" id="confirm-dlg">
  <form method="dialog">
    <h3 id="confirm-title"></h3>
    <p class="dlg-note" id="confirm-text"></p>
    <div class="dlg-actions">
      <button class="btn ghost" value="cancel" type="submit">Cancelar</button>
      <button class="btn danger" value="ok" type="submit" id="confirm-ok"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="alert" hidden></div>

<script src="app.js"></script>
<script src="library.js"></script>
</body>
</html>
