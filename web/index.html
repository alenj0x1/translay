<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traductor de video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body class="view-library layout-wide">
<header class="bar">
  <div class="brand">Traductor <span>en → es</span></div>
  <div class="file" id="file-name"></div>
  <div class="status" id="status" data-state="off"><i></i><span>sin conexión</span></div>
  <div class="metrics" id="metrics"></div>
  <form class="yt" id="yt"><input id="yt-url" type="text" placeholder="youtube.com/watch?v=…" spellcheck="false"><button class="btn" type="submit">Abrir</button></form>
  <div class="save-wrap player-only">
    <button class="btn" id="save" type="button">Guardar en…</button>
    <div class="popover" id="save-pop" hidden>
      <ul id="save-list"></ul>
      <form id="save-new"><input id="save-name" type="text" placeholder="Nueva colección" maxlength="80"><button class="btn" type="submit">Crear</button></form>
    </div>
  </div>
  <button class="btn player-only" id="mode" type="button">Escuchar original</button>
  <button class="btn player-only" id="layout" type="button">Ver dividido</button>
  <div class="queue-wrap">
    <button class="btn" id="queue-btn" type="button">Cola<span class="badge" id="queue-badge" hidden></span></button>
    <div class="popover queue-pop" id="queue-pop" hidden>
      <div class="queue-head"><span id="queue-state"></span><button class="btn" id="queue-toggle" type="button"></button></div>
      <ul id="queue-list"></ul>
      <button class="btn ghost" id="queue-clear" type="button" hidden>Limpiar terminados</button>
    </div>
  </div>
  <div class="prefs-wrap">
    <button class="btn" id="prefs-btn" type="button">Preferencias</button>
    <div class="popover prefs-pop" id="prefs-pop" hidden><div id="prefs-list"></div></div>
  </div>
  <button class="btn" id="view" type="button">Biblioteca</button>
  <label class="btn">Abrir video<input id="file" type="file" accept="video/*,audio/*" hidden></label>
</header>

<main class="stage">
  <section class="pane">
    <div class="tag">EN · original</div>
    <div class="screen">
      <video id="v-en" controls playsinline preload="auto"></video>
      <div class="caption" id="cap-en"><span class="c"></span><span class="t"></span></div>
      <div class="caption es-wide" id="cap-es-wide"><span class="c"></span></div>
      <div class="ready" id="ready" hidden><i></i><span></span><b><em></em></b></div>
    </div>
    <div class="timeline" id="tl-en"></div>
  </section>
  <section class="pane">
    <div class="tag">ES · traducido</div>
    <div class="screen">
      <video id="v-es" muted playsinline preload="auto"></video>
      <div class="caption" id="cap-es"><span class="c"></span></div>
    </div>
    <div class="timeline" id="tl-es"></div>
  </section>
</main>

<ol class="transcript" id="transcript"></ol>

<section class="library" id="library">
  <nav class="collections" id="collections"></nav>
  <div class="shelf">
    <div class="shelf-head" id="shelf-head"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<script src="app.js"></script>
<script src="library.js"></script>
</body>
</html>
