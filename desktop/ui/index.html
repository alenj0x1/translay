<!doctype html>
<html lang="es" class="desktop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translay</title>
<script>
  // Before the first paint, Translay's look from its last launch (saved by the app, src-tauri/src/lib.rs › set_look):
  // the theme (else the system's) and the accent color (else Translay's violet; "none" = the theme's own).
  (function () {
    var t = window.__TRANSLAY_THEME__ || "";
    try { t = t || localStorage.getItem("vt-theme-block") || ""; } catch (e) {}
    var root = document.documentElement;
    root.dataset.theme = t || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var a = (window.__TRANSLAY_LOOK__ || {}).accent || "#7d5ba6";
    if (/^#[0-9a-f]{6}$/i.test(a)) {
      var c = [1, 3, 5].map(function (i) { return parseInt(a.slice(i, i + 2), 16) / 255; });
      root.dataset.libAccent = "";
      root.style.setProperty("--accent-base", a);
      root.style.setProperty("--on-accent-dark", 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2] > 0.55 ? "#111111" : "#ffffff");
    }
  })();
</script>
<!-- shared/ is copied from web/ by scripts/prepare.mjs: same font, colors and buttons as Translay -->
<link rel="stylesheet" href="shared/css/fonts.css">
<link rel="stylesheet" href="shared/css/tokens.css">
<link rel="stylesheet" href="shared/css/base.css">
<link rel="stylesheet" href="shared/css/components/button.css">
<link rel="stylesheet" href="shared/css/components/controls.css">
<link rel="stylesheet" href="shared/css/components/desktop.css">
<link rel="stylesheet" href="shared/css/components/carousel.css">
<link rel="stylesheet" href="shared/css/components/star.css">
<link rel="stylesheet" href="shared/css/views/vaults.css">
<link rel="stylesheet" href="setup.css">
<link rel="stylesheet" href="wizard.css">
</head>
<body>

<header class="bar" data-tauri-drag-region>
  <div class="brand" data-tauri-drag-region><span class="wordmark" data-size="22">translay</span></div>
  <div class="spacer" data-tauri-drag-region></div>
  <button class="btn ghost icon" id="theme-btn" type="button"></button>
  <div class="win-controls">
    <button class="btn ghost icon win-btn" id="win-min" type="button" title="Minimizar" aria-label="Minimizar"></button>
    <button class="btn ghost icon win-btn" id="win-max" type="button"></button>
    <button class="btn ghost icon win-btn" id="win-close" type="button" title="Cerrar" aria-label="Cerrar"></button>
  </div>
</header>

<main class="stage">
  <!-- the background scene Translay shows (Ajustes › Apariencia › Fondo); the first time, «Translay» -->
  <div class="scene-box" id="scene" aria-hidden="true"></div>
  <div class="dock">
  <!-- first launch: what gets installed and where the library goes -->
  <section class="panel" id="setup" hidden>
    <h1 data-i18n>Preparar Translay</h1>
    <div class="rows">
      <div class="row">
        <span class="row-ic" data-ic="monitor"></span>
        <div class="row-text"><strong data-i18n>Tu equipo</strong><p id="gpu"></p></div>
        <span class="tag" id="mode"></span>
      </div>
      <div class="row">
        <span class="row-ic" data-ic="folder"></span>
        <div class="row-text"><strong data-i18n>Biblioteca</strong><p id="data-dir"></p></div>
        <button class="btn sm" id="pick" type="button"></button>
      </div>
      <div class="row">
        <span class="row-ic" data-ic="download"></span>
        <div class="row-text"><strong data-i18n>Se instala</strong><p id="size"></p></div>
      </div>
    </div>
    <div class="go">
      <button class="btn dark" id="install" type="button"></button>
      <p class="note" id="install-note"></p>
    </div>
  </section>

  <!-- first launch, after the server: the profile, which decides the voice engine and the models -->
  <section class="panel" id="profile" hidden>
    <h1 data-i18n>Elige cómo usar Translay</h1>
    <div class="rows" id="profiles"></div>
    <div class="go">
      <button class="btn dark" id="prepare" type="button"></button>
      <p class="note" id="prepare-note"></p>
    </div>
  </section>

  <!-- first launch, while the voice engine installs and the models download: the first-run wizard (wizard.js) -->
  <section class="panel wizard" id="wizard" hidden>
    <nav class="wz-rail" id="wz-rail"></nav>
    <div class="wz-main">
      <header class="wz-head"><h2 id="wz-title"></h2><p id="wz-lead"></p></header>
      <div class="wz-body" id="wz-body"></div>
    </div>
    <footer class="wz-foot">
      <div class="wz-progress" id="wz-progress">
        <div class="strip-line"><strong id="wz-load"></strong><span class="pct" id="wz-pct"></span></div>
        <div class="bar-track"><i id="wz-bar"></i></div>
      </div>
      <div class="wz-acts">
        <button class="btn ghost" id="wz-back" type="button"></button>
        <button class="btn ghost" id="wz-skip" type="button"></button>
        <button class="btn dark" id="wz-next" type="button"></button>
      </div>
    </footer>
  </section>

  <!-- every launch: the server loads its models (and downloads them the first time), with what it is doing and tips -->
  <section class="panel strip" id="loading" hidden>
    <span class="wordmark" data-size="26">translay</span>
    <div class="strip-main">
      <div class="strip-line"><strong id="load-line"></strong><span class="pct" id="load-pct"></span></div>
      <div class="bar-track"><i id="load-bar"></i></div>
      <p class="tip"><span data-ic="spark"></span><span id="tip"></span></p>
    </div>
  </section>

  <!-- the server stopped -->
  <section class="panel" id="failed" hidden>
    <h1 data-i18n>Translay se detuvo</h1>
    <p class="lead" id="fail-msg"></p>
    <pre class="log" id="fail-log"></pre>
    <div class="acts">
      <button class="btn dark" id="retry" type="button"></button>
      <button class="btn" id="open-logs" type="button"></button>
    </div>
  </section>
  </div>
</main>

<script src="shared/js/ui.js"></script>
<script src="i18n.js"></script>
<script src="shared/js/brand.js"></script>
<script src="shared/js/scenes.js"></script>
<script src="shared/js/vaultlook.js"></script>
<script src="shared/js/star.js"></script>
<script src="wizard.js"></script>
<script src="setup.js"></script>
</body>
</html>
