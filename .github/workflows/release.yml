name: Versión

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # acciones fijadas por commit: una etiqueta movida no cambia lo que corre aquí
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri
      - name: Instalador (Tauri + NSIS)
        run: |
          npm --prefix desktop ci
          npm --prefix desktop run build
      - name: Notas desde los dos changelogs (inglés y, debajo, español)
        run: |
          v="${GITHUB_REF_NAME#v}"
          section() { awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / && on {exit} on' "$1"; }
          { section CHANGELOG.md; printf '\n---\n\n### Español\n\n'; section CHANGELOG.es.md; } > notas.md
          test -s notas.md
      - name: Crear la versión con el instalador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # una versión con guion (1.7.0-beta.1) es de prueba: no queda como «latest», así las apps no la avisan
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" $pre --title "Translay ${GITHUB_REF_NAME#v}" --notes-file notas.md \
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
